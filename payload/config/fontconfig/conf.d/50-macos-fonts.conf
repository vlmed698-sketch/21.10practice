<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Шрифты macOS (~/.local/share/fonts/macOS): замены для отсутствующих SF Pro / SF Mono -->
<fontconfig>
  <!-- Моноширинный по умолчанию: Menlo (SF Mono не извлечён) -->
  <alias><family>monospace</family><prefer><family>Menlo</family></prefer></alias>
  <alias><family>SF Mono</family><prefer><family>Menlo</family></prefer></alias>
  <alias><family>SF NS Mono</family><prefer><family>Menlo</family></prefer></alias>
  <!-- Системный шрифт Apple (SF Pro) не извлечён: используем Inter, затем Helvetica Neue -->
  <alias><family>SF Pro</family><prefer><family>Inter</family><family>Helvetica Neue</family></prefer></alias>
  <alias><family>SF Pro Display</family><prefer><family>Inter</family><family>Helvetica Neue</family></prefer></alias>
  <alias><family>SF Pro Text</family><prefer><family>Inter</family><family>Helvetica Neue</family></prefer></alias>
  <alias><family>SF NS</family><prefer><family>Inter</family><family>Helvetica Neue</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Inter</family><family>Helvetica Neue</family></prefer></alias>
  <alias><family>BlinkMacSystemFont</family><prefer><family>Inter</family><family>Helvetica Neue</family></prefer></alias>
</fontconfig>
